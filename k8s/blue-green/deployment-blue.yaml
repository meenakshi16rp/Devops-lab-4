apiVersion: apps/v1
kind: Deployment
metadata:
  name: ensp461-lab4-app-blue
  namespace: lab4-meenakshi
  labels:
    app: ensp461-lab4-app
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ensp461-lab4-app
      slot: blue
  template:
    metadata:
      labels:
        app: ensp461-lab4-app
        slot: blue
    spec:
      containers:
        - name: app
          image: ensp461-lab4-app:4.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "4.0.0"
            - name: DEPLOYMENT_SLOT
              value: "blue"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
