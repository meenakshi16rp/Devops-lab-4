apiVersion: v1
kind: Service
metadata:
  name: ensp461-lab4-app-prod
  namespace: lab4-meenakshi
spec:
  type: ClusterIP
  selector:
    app: ensp461-lab4-app
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
