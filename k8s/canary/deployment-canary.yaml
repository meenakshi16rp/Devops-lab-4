apiVersion: apps/v1
kind: Deployment
metadata:
  name: ensp461-lab4-app-canary
  namespace: lab4-meenakshi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ensp461-lab4-app-canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: ensp461-lab4-app-canary-demo
        track: canary
    spec:
      containers:
        - name: app
          image: ensp461-lab4-app:4.2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "4.2.0"
            - name: DEPLOYMENT_SLOT
              value: "canary"
            - name: SIMULATE_ERROR_RATE
              value: "0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: ensp461-lab4-app-canary-svc
  namespace: lab4-meenakshi
spec:
  selector:
    app: ensp461-lab4-app-canary-demo
    track: canary
  ports:
    - port: 5000
      targetPort: 5000
